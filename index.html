          var combined = (msg || '') + ' ' + (src || '') + ' ' + (stack || '');

            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('safari-extension://') !== -1 ||
            combined.indexOf('Failed to connect to MetaMask') !== -1 ||

          var stack = e.error && e.error.stack ? String(e.error.stack) : '';
          if (isExtensionError(e.message, e.filename, stack)) {
            e.preventDefault();
            e.stopImmediatePropagation();

          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = '';
          var stack = '';
          if (typeof reason === 'string') {

            stack = reason.stack ? String(reason.stack) : '';
          }
          if (isExtensionError(msg, '', stack)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
