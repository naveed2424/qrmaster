<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="In-Browser AI Performance: WebGPU Compute Shaders vs. Legacy WebGL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="20" fill="url(#bg)"/>
  <rect x="16" y="16" width="928" height="448" rx="16" fill="none" stroke="#27272a" stroke-width="1.5"/>
  <rect x="40" y="34" width="6" height="42" rx="3" fill="#f59e0b"/>
  <text x="58" y="54" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800">In-Browser AI Performance: WebGPU Compute Shaders vs. Legacy WebGL</text>
  <text x="58" y="76" fill="#a1a1aa" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">Reported acceleration across large tensor multiplications &amp; 4-bit local models</text>
  <text x="44" y="138" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Matrix Math Speedup vs WebGL</text>
  <text x="44" y="156" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Storage buffers &amp; shared workgroup GPU memory</text>
  <rect x="345" y="124" width="450" height="28" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="345" y="124" width="382" height="28" rx="8" fill="url(#gold)"/>
  <text x="813" y="143" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="800">3x – 8x</text>
  <text x="44" y="206" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Token Delay Drop (Apple M-Chip)</text>
  <text x="44" y="224" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Sub-100ms local token latency without cloud</text>
  <rect x="345" y="192" width="450" height="28" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="345" y="192" width="333" height="28" rx="8" fill="url(#cyan)"/>
  <text x="813" y="211" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="800">320→85ms</text>
  <text x="44" y="274" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Compact 1B SLM Footprint</text>
  <text x="44" y="292" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">4-bit quantized weights cached locally in browser</text>
  <rect x="345" y="260" width="450" height="28" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="345" y="260" width="126" height="28" rx="8" fill="url(#emerald)"/>
  <text x="813" y="279" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="800">~695 MB</text>
  <text x="44" y="342" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Network Roundtrip Overhead</text>
  <text x="44" y="360" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Zero server queues, zero per-token billing meter</text>
  <rect x="345" y="328" width="450" height="28" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="345" y="328" width="8" height="28" rx="8" fill="url(#rose)"/>
  <text x="813" y="347" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="800">0 ms API</text>
  <line x1="40" y1="432" x2="920" y2="432" stroke="#27272a" stroke-width="1"/>
  <text x="40" y="452" fill="#71717a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11">Source: WebGPU &amp; Edge SLM Browser Benchmarks (2026) · 2qrcode.com Editorial Brief</text>
  <text x="920" y="452" text-anchor="end" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="11" font-weight="700">2QRCODE.COM DATA BRIEF</text>
</svg>