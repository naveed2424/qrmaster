<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Public Sentiment &amp; Everyday Side-Effect Warnings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="20" fill="url(#bg)"/>
  <rect x="16" y="16" width="928" height="448" rx="16" fill="none" stroke="#27272a" stroke-width="1.5"/>
  <rect x="40" y="34" width="6" height="42" rx="3" fill="#f59e0b"/>
  <text x="58" y="54" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800">Public Sentiment &amp; Everyday Side-Effect Warnings</text>
  <text x="58" y="76" fill="#a1a1aa" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">Consumer ambivalence toward rapid AI integration in everyday personal life</text>
  <text x="44" y="128" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Say AI Advances Too Fast</text>
  <text x="44" y="146" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Concern over missing human oversight &amp; guardrails</text>
  <rect x="340" y="114" width="460" height="28" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="340" y="114" width="303" height="28" rx="8" fill="url(#rose)"/>
  <text x="818" y="133" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="800">~66%</text>
  <text x="44" y="190" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">More Concerned Than Excited</text>
  <text x="44" y="208" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Cite privacy erosion, fakes &amp; autonomy loss</text>
  <rect x="340" y="176" width="460" height="28" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="340" y="176" width="239" height="28" rx="8" fill="url(#gold)"/>
  <text x="818" y="195" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="800">52%</text>
  <text x="44" y="252" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Worry Creative Thinking Drops</text>
  <text x="44" y="270" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Cognitive offloading in writing &amp; problem solving</text>
  <rect x="340" y="238" width="460" height="28" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="340" y="238" width="230" height="28" rx="8" fill="url(#cyan)"/>
  <text x="818" y="257" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="800">~50%</text>
  <text x="44" y="314" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Human Connections Weakening</text>
  <text x="44" y="332" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Synthetic companionship replacing real ties</text>
  <rect x="340" y="300" width="460" height="28" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="340" y="300" width="230" height="28" rx="8" fill="url(#rose)"/>
  <text x="818" y="319" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="800">~50%</text>
  <text x="44" y="376" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">More Excited Than Concerned</text>
  <text x="44" y="394" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Small minority expressing net optimism</text>
  <rect x="340" y="362" width="460" height="28" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="340" y="362" width="46" height="28" rx="8" fill="url(#emerald)"/>
  <text x="818" y="381" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="800">~10%</text>
  <line x1="40" y1="432" x2="920" y2="432" stroke="#27272a" stroke-width="1"/>
  <text x="40" y="452" fill="#71717a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11">Source: Pew Research Center National AI Surveys · 2qrcode.com Editorial Research</text>
  <text x="920" y="452" text-anchor="end" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="11" font-weight="700">2QRCODE.COM DATA BRIEF</text>
